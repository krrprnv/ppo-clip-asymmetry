[project]
name = "ppo-clip-asymmetry"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.1",
    "minatar>=1.0.15",
    "numpy>=2.5.2",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
